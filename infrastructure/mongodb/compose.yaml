# Erovians — local MongoDB Community Server
#
# Milestone 1 infrastructure only. This stack is additive: it does not
# touch, replace, or depend on the existing PostgreSQL/Prisma setup.
#
# Usage:
#   cd infrastructure/mongodb
#   cp .env.example .env      # fill in real credentials, never commit .env
#   docker compose up -d
#
# See README.md for full instructions and troubleshooting.

services:
  # ── mongodb: the actual MongoDB Community Server ──
  # Started as a single-node replica set (required for transactions, used
  # by later milestones) with authentication enabled from the first boot.
  # A keyfile is generated on first start (inside a Docker-managed volume,
  # never a host bind mount, so file-permission quirks on Windows/macOS
  # never cause mongod's "permissions too open" keyfile check to fail).
  mongodb:
    image: mongo:7.0
    container_name: erovians-mongodb
    restart: unless-stopped
    command: >
      bash -c "
      set -e;
      KEYFILE=/data/keyfile/mongo-keyfile;
      if [ ! -f \"$$KEYFILE\" ]; then
        echo '[mongodb] generating replica set keyfile...';
        openssl rand -base64 756 > \"$$KEYFILE\";
        chmod 400 \"$$KEYFILE\";
        chown mongodb:mongodb \"$$KEYFILE\";
      fi;
      exec docker-entrypoint.sh mongod
        --replSet ${MONGO_REPLICA_SET_NAME:-erovians-rs0}
        --keyFile \"$$KEYFILE\"
        --bind_ip_all
        --auth
      "
    environment:
      # Consumed once, only on an empty data directory, by the official
      # image's own bootstrap logic — creates the cluster root superuser.
      # The application itself never uses these credentials (see mongo-init).
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - erovians-mongo-data:/data/db
      - erovians-mongo-config:/data/configdb
      - erovians-mongo-keyfile:/data/keyfile
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u", "${MONGO_ROOT_USER}",
          "-p", "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--eval", "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - erovians-net

  # ── mongo-init: one-shot initialization job ──
  # Waits for mongodb to report healthy (i.e. fully up, replSet flag active,
  # root user created), then initiates the replica set and creates the
  # least-privilege application user. Runs once and exits 0 — an
  # "Exited (0)" status for this service in `docker compose ps` is success,
  # not a crash. Safe to re-run: both steps are idempotent.
  mongo-init:
    image: mongo:7.0
    container_name: erovians-mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?MONGO_ROOT_USER is required}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      MONGO_REPLICA_SET_NAME: ${MONGO_REPLICA_SET_NAME:-erovians-rs0}
      MONGO_APP_DB: ${MONGO_DB_NAME:?MONGO_DB_NAME is required}
      MONGO_APP_USER: ${MONGO_USER:?MONGO_USER is required}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    volumes:
      - ./init.js:/scripts/init.js:ro
    entrypoint: ["mongosh"]
    # ${MONGO_ROOT_USER}/${MONGO_ROOT_PASSWORD} are interpolated by Docker
    # Compose itself (from .env) at `docker compose` invocation time, not by
    # a shell inside the container — this service has no shell entrypoint.
    # Keep root credentials free of URI-reserved characters (: / @ % ?) or
    # percent-encode them, since they're embedded directly into a URI here.
    command:
      - "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/admin?directConnection=true"
      - "/scripts/init.js"
    networks:
      - erovians-net

volumes:
  erovians-mongo-data:
    name: erovians-mongo-data
  erovians-mongo-config:
    name: erovians-mongo-config
  erovians-mongo-keyfile:
    name: erovians-mongo-keyfile

networks:
  erovians-net:
    name: erovians-net
    driver: bridge
